# =====================================================================
# UBT TECHNOLOGY ? application.properties  (CORS FIXED)
# Variable names match Railway: DB_URL, DB_USERNAME, DB_PASSWORD,
#   CORS_ORIGINS, JWT_SECRET, ADMIN_PASSWORD, CLOUD_NAME/KEY/SECRET
# =====================================================================

server.port=${PORT:8080}
server.servlet.context-path=/api

# ??? DATABASE ?????????????????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ubt_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Prajwal@8275}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ??? HIKARI ???????????????????????????????????????????????????????????
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-test-query=SELECT 1

# ??? JPA ??????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ??? FILE UPLOAD ??????????????????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ??? JWT ??????????????????????????????????????????????????????????????
app.jwt.secret=${JWT_SECRET:UBTTechnologyIncubationSecretKey2025NagpurMaharashtraSecure}
app.jwt.expiration=86400000

# ??? CORS  ????????????????????????????????????????????????????????????
